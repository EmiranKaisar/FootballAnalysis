[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-football-analysis"
version = "0.1.0"
description = "Private local proof of concept for team-level football clip analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
  "huggingface-hub>=0.34,<2",
  "lap>=0.5.12,<1",
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "streamlit>=1.46,<2",
  "torch>=2.7,<3",
  "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
